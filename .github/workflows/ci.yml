name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: docker.io/library/postgres:17-alpine
        env:
          POSTGRES_USER: pbl360
          POSTGRES_PASSWORD: pbl360
          POSTGRES_DB: pbl360_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pbl360"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USERNAME: pbl360
      DB_PASSWORD: pbl360
      DB_NAME: pbl360_test

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test:cov

      - name: Run migrations
        run: npm run migration:run

      - name: Check entity/migration drift
        run: |
          output=$(npm run typeorm -- schema:log)
          echo "$output"
          echo "$output" | grep -q 'up to date'

      - name: E2E tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run type-check

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

  deploy:
    name: Deploy (Railway + Vercel)
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Railway and Vercel CLIs
        run: npm install --global @railway/cli vercel

      - name: Deploy API (Railway)
        run: >-
          railway up backend --path-as-root --ci
          --project 8251cb98-4314-4802-91d6-09a708e7df76 --environment production --service api
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}

      - name: Deploy front (Vercel)
        working-directory: frontend
        run: vercel deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_dI9UTeTOsBhAqFvQYKNDrwUj
          VERCEL_PROJECT_ID: prj_tm73OF39fZjmK5sniUBYf3u9R2I3
